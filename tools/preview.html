<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百宝抽屉 · 工具预览台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: #1c2026; color: #dfe4ea;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; gap: 28px; align-items: flex-start; justify-content: center;
    padding: 24px 20px;
  }
  .stage { flex: none; }
  .phone {
    width: 402px; height: 868px; border-radius: 34px; padding: 6px;
    background: #0b0d0f; box-shadow: 0 18px 60px rgba(0,0,0,.55), inset 0 0 0 1px #343b43;
    position: relative; overflow: hidden;
  }
  .phone iframe {
    width: 390px; height: 856px; border: none; border-radius: 28px; background: #000;
    display: block; position: absolute; top: 6px; left: 6px;
  }
  /* 横屏工具：手机框直接躺倒 */
  .phone.landscape { width: 868px; height: 402px; }
  .phone.landscape iframe { width: 856px; height: 390px; }
  @media (max-height: 960px), (max-width: 1300px) {
    body { zoom: min(calc((100vh - 48px) / 920), calc((100vw - 320px) / 920)); }
  }
  .panel { width: 250px; flex: none; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
  .panel h1 { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .panel .hint { font-size: 12px; line-height: 1.7; color: #9aa3ad; }
  .grp { font-size: 11px; color: #8a939d; margin-top: 8px; letter-spacing: 1px; }
  button {
    width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #3a4149; background: #262c33; color: #dfe4ea;
    font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover { background: #2f363e; }
  button.on { border-color: #3ecfa4; color: #3ecfa4; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone"><iframe id="app" allow="downloads" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"></iframe></div>
  </div>
  <div class="panel">
    <h1>百宝抽屉 · 工具预览台</h1>
    <div class="hint">左边是 390×844 的真机版式，点右边切换工具/产品。计分板与尺子（横拿）会自动横过来。</div>
    <div class="grp">工具与产品（尺子多一个横拿预览）</div>
    <div id="tools" style="display:flex; flex-direction:column; gap:10px;"></div>
    <div class="hint" id="tip" style="margin-top:10px"></div>
  </div>
<script>
  const TOOLS = [
    { name: '🖼 图片擦除', url: 'http://localhost:5183/', land: false,
      tip: '先「打开图片」选一张（电脑可拖拽/粘贴）；吸管在图上取色，或直接用笔涂——笔会自动贴合周围底色。涂错点撤销，右下保存。' },
    { name: '📏 尺子（竖拿）', url: 'http://localhost:5184/', land: false,
      tip: '贴左缘量，0 点在上；刻度按本机屏幕真实尺寸自动定标，不可调。右下 ⚙ 看识别到的机型，可一键全屏。' },
    { name: '📏 尺子（横拿）', url: 'http://localhost:5184/', land: true,
      tip: '横拿验证：尺子自动躺到最长边（顶缘、0 点在左），数字立正对着人，与长边垂直。' },
    { name: '🀄 计分板', url: 'http://localhost:5185/', land: true,
      tip: '横屏对垒：一侧上翻 +1、下翻 −1，翻页跟手指走；单击屏幕呼出「返回 / 归零」。比分自动记住。' },
    { name: '📞 模拟来电', url: 'http://localhost:5186/', land: false,
      tip: '填来电人、几秒后来电，点「开始模拟」；到点 iPhone 锁屏来电（铃声+震动），接听进通话计时。' },
    { name: '🎲 摇骰子', url: 'http://localhost:5187/', land: false,
      tip: '点「摇」：骰盅盖下摇、扣住保密；在画面上上划开盅报点数、下划盖回；盖着可直接再摇。上方 −／＋ 调骰子数（默认 5）。' },
    { name: '🧾 摊主点单', url: 'http://localhost:5188/', land: false,
      tip: '点空闲桌号直接点单提交（语音播报）；点用餐中桌号看出餐/加菜/清台。「模拟顾客」可演示新单/加单/呼叫。' },
  ];

  const frame = document.getElementById('app');
  const phone = document.getElementById('phone');
  const tip = document.getElementById('tip');
  const group = document.getElementById('tools');

  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.name;
    if (i === 0) b.classList.add('on');
    b.onclick = () => {
      group.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      phone.classList.toggle('landscape', t.land);
      frame.src = t.url;
      tip.textContent = t.tip;
    };
    group.appendChild(b);
  });

  frame.src = TOOLS[0].url;
  tip.textContent = TOOLS[0].tip;

  // 工具 iframe 里点「下载」→ 把图交给顶层（同源）触发真下载，绕开跨 origin 拦截
  window.addEventListener('message', async (e) => {
    const d = e.data;
    if (!d || d.type !== 'save-image' || !d.url) return;
    try {
      const blob = await (await fetch(d.url)).blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = d.name || 'image.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      e.source && e.source.postMessage({ type: 'save-image-done' }, '*');
    } catch { /* 忽略，工具侧会自动走兜底 */ }
  });
</script>
</body>
</html>
